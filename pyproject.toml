[project]
name = "aida-data"
version = "0.1.0"
description = "Tools manage and preprocess datasets"
readme = "README.md"
authors = [
    { name = "Matteo Ceccarello", email = "matteo.ceccarello@unipd.it" }
]
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.16.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "tqdm>=4.70.1",
    "xlrd>=2.0.2",
]

[project.scripts]
aida-data = "aida_data:main"

[project.optional-dependencies]
shuttle = [
    "unlzw3>=0.2.3",
]
wfdb = [
    "wfdb>=4.3.1",
]

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "unlzw3>=0.2.3",
    "wfdb>=4.3.1",
]

[tool.pytest.ini_options]
markers = ["network: tests that download datasets (deselected by default, run with `-m network`)"]
addopts = "-m 'not network'"
